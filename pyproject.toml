[project]
name = "sqlagent"
version = "1.0.0"
description = "Natural-language to SQL agent with self-correction and an execution-accuracy benchmark"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sqlglot>=25"]

[project.optional-dependencies]
hf = ["transformers>=4.45", "torch", "accelerate"]
demo = ["gradio>=5"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["sqlagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
